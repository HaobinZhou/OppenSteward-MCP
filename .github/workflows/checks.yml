name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      STEPWISE_R_TEST_SKILL_ROOT: ${{ github.workspace }}/.runtime/academic-skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HaobinZhou/academic-skills
          ref: 56e7f515e333e2eb3880e3259eeb681e8d8783ad
          path: .runtime/academic-skills
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run pytest -q
