[project]
name = "oppenproject"
version = "0.1.0"
description = "OAuth-protected, read-only MCP access to skill-managed local projects"
requires-python = ">=3.12"
dependencies = ["mcp>=1.28,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
