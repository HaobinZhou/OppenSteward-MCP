[project]
name = "oppen-steward-mcp"
version = "0.3.0"
description = "Project governance and writable discussions, with OAuth HTTP and Secure MCP Tunnel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp>=1.28,<2", "python-dotenv>=1,<2", "pywin32>=310; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
